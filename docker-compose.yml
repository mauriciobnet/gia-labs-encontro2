# GIA: stack do Encontro 2, laboratórios 5 a 7
#
# Projeto Docker próprio (gia-e2): containers e volumes deste encontro não se misturam com os
# do Encontro 1, que continuam na pasta gia-labs. As duas stacks usam a mesma porta, então
# só uma fica no ar por vez (ver README).
#
# Base (sempre):    traefik, whoami, home, toolbox, openldap, lam, keycloak, grafana
# --profile lab6:   oauth2-proxy + app (SSO OIDC)                            -> Lab 6
# --profile lab7:   idp (SimpleSAMLphp, o parceiro externo SAML)             -> Lab 7, opcional (só amd64)
# --profile tools:  check (verificação do ambiente)
#
# Subir:       docker compose up -d --build --wait
# Preparação:  docker compose exec -T toolbox bash /work/scripts/preparar-encontro2.sh
#              docker compose restart keycloak grafana
# Lab 6:       docker compose --profile lab6 up -d --wait
# Reset:       docker compose --profile lab6 --profile lab7 --profile tools down -v   (apaga só este projeto)
#
# Porta: definida em .env (GIA_PORT, padrão 18080). Nunca 80 nem 443, porque a
# máquina do aluno pode já estar usando essas portas. O Traefik escuta na MESMA
# porta por dentro e por fora, então a URL do navegador e a URL usada pelos
# containers são idênticas (os endereços que o Keycloak devolve dependem disso).
#
# Painel do laboratório:  http://localhost:18080
#
# URLs (via Traefik, todas com :18080):
#   whoami.localhost  traefik.localhost  lam.localhost  keycloak.localhost (admin/admin)
#   grafana.localhost  app.localhost  idp.localhost

name: gia-e2

x-hosts: &hosts
  # Containers resolvem estes nomes para o Traefik e usam a MESMA URL que o navegador
  # (issuer/redirect idênticos). Só o curl do toolbox precisa do encaminhador do entrypoint.
  - keycloak.localhost
  - gia.localhost
  - lam.localhost
  - whoami.localhost
  - grafana.localhost
  - app.localhost
  - idp.localhost

services:
  traefik:
    image: traefik:v3.6   # >= v3.6 obrigatório com Docker Engine >= 29
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:${GIA_PORT:-18080}
    ports:
      # Mesma porta nos dois lados: o container escuta em ${GIA_PORT:-18080} e ela é
      # publicada com o mesmo número, para a URL não mudar de um lado para o outro.
      - "${GIA_BIND:+${GIA_BIND}:}${GIA_PORT:-18080}:${GIA_PORT:-18080}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.localhost`)
      - traefik.http.routers.traefik.service=api@internal
    networks:
      gia:
        aliases: *hosts

  whoami:
    image: traefik/whoami:v1.10
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.localhost`)
    networks: [gia]

  # ================= Painel do laboratório =================
  home:
    # Painel servido na raiz: http://localhost:${GIA_PORT:-18080}
    # Usa a MESMA imagem do toolbox (alpine + python3), então não baixa nada a mais.
    build: ./toolbox
    image: gia/toolbox:v1
    command: ["python3", "/painel/servidor.py"]
    # o painel sai sozinho quando o próprio código muda; o restart traz ele de volta
    # já com a versão nova, sem precisar de docker compose up
    restart: unless-stopped
    environment:
      GIA_PORT: ${GIA_PORT:-18080}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./home:/painel:ro
      # fora de /painel: montar um volume DENTRO de outro montado como somente
      # leitura falha, porque o runc não consegue criar o ponto de montagem lá.
      - ./tutorial:/tutorial:ro
      - toolbox_out:/carimbos:ro   # o que cada lab deixou registrado
    labels:
      - traefik.enable=true
      - "traefik.http.routers.home.rule=Host(`localhost`) || Host(`gia.localhost`) || Host(`127.0.0.1`)"
      - traefik.http.services.home.loadbalancer.server.port=8000
      # Rede de segurança: qualquer host sem rota conhecida cai no painel em vez de 404.
      - "traefik.http.routers.home-catchall.rule=PathPrefix(`/`)"
      - traefik.http.routers.home-catchall.priority=1
      - traefik.http.routers.home-catchall.service=home
    networks: [gia]

  toolbox:
    build: ./toolbox
    image: gia/toolbox:v1
    command: sleep infinity
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      GIA_PORT: ${GIA_PORT:-18080}
    volumes:
      - ./scripts:/work/scripts:ro
      - toolbox_out:/work/out
      # A PKI é gerada aqui dentro (openssl), pela preparação do encontro, e precisa aparecer
      # no host para ser montada no openldap, no grafana e no keycloak (pasta confianca). Por
      # isso esta é a montagem de escrita do toolbox, junto com a do grafana.
      - ./pki:/work/pki
      - ./ldap:/work/ldap:ro
      - ./grafana:/work/grafana
    networks: [gia]

  check:
    build: ./toolbox
    image: gia/toolbox:v1
    command: /check.sh
    environment:
      GIA_PORT: ${GIA_PORT:-18080}
    volumes:
      - ./scripts:/work/scripts:ro # evidencia.py, que grava o arquivo de entrega
      - toolbox_out:/work/out      # onde o Lab 1 deixa a evidência lida pelo painel
    profiles: [tools]
    networks: [gia]

  # ================= Lab 2: diretório =================
  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "ACME Ensino"
      LDAP_DOMAIN: "acme.edu.br"
      LDAP_BASE_DN: "dc=acme,dc=edu,dc=br"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_TLS: "false"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
    command: ["--copy-service", "--loglevel", "info"]
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif:ro
      # A pasta começa vazia e é preenchida pela preparação do encontro (no Encontro 1, pelo
      # Lab 4); o slapd só passa a usar os arquivos quando o cn=config apontar para eles.
      # Montar a PASTA (e não cada arquivo) é de propósito: montagem de arquivo único prende
      # o inode, e a troca do arquivo no host não chega no container.
      - ./pki/ldap:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=acme,dc=edu,dc=br -D cn=admin,dc=acme,dc=edu,dc=br -w admin '(uid=ana.souza)' uid | grep -q 'uid: ana.souza'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [gia]

  lam:
    image: ghcr.io/ldapaccountmanager/lam:9.1
    environment:
      LDAP_SERVER: "ldap://openldap:389"
      LDAP_DOMAIN: "acme.edu.br"
      LDAP_BASE_DN: "dc=acme,dc=edu,dc=br"
      LDAP_USERS_DN: "ou=people,dc=acme,dc=edu,dc=br"
      LDAP_GROUPS_DN: "ou=groups,dc=acme,dc=edu,dc=br"
      LDAP_USER: "cn=admin,dc=acme,dc=edu,dc=br"
      LAM_PASSWORD: "admin"
      LAM_LANG: "pt_BR"
    labels:
      - traefik.enable=true
      - traefik.http.routers.lam.rule=Host(`lam.localhost`)
      - traefik.http.services.lam.loadbalancer.server.port=80
    depends_on:
      openldap: { condition: service_healthy }
    networks: [gia]

  # ================= Lab 5: IdP =================
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak.localhost:${GIA_PORT:-18080}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      TZ: ${TZ:-America/Sao_Paulo}
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`keycloak.localhost`)
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    volumes:
      - kc_data:/opt/keycloak/data
      # Lab 5: a federação LDAP fala StartTLS com o diretório e confere o certificado dele com
      # a CA da ACME (a do Lab 4). O Keycloak lê sozinho os certificados de conf/truststores ao
      # subir. A pasta é pki/confianca, e não pki/ca, porque lá também mora a chave privada da
      # CA, que ele não deve ler. Vazia (antes do Lab 5), o Keycloak sobe igual.
      - ./pki/confianca:/opt/keycloak/conf/truststores/acme:ro
    healthcheck:
      # a imagem não tem curl; usa /dev/tcp do bash contra a porta de management (9000)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    depends_on:
      openldap: { condition: service_healthy }
    networks: [gia]

  # ================= Grafana: diretório e OIDC =================
  grafana:
    image: grafana/grafana-oss:11.6.0
    # Labs 3 e 4: autentica direto no diretório (LDAP), depois com a conexão cifrada. A partir
    # do Lab 5 o mesmo Grafana também aceita OIDC pelo Keycloak. As duas portas convivem, e é
    # essa comparação que motiva a federação: pelo diretório, a aplicação conhece o diretório
    # e vê a senha; pelo Keycloak, ela só confia num token e nunca vê a senha.
    volumes:
      - ./grafana/ldap.toml:/etc/grafana/ldap.toml:ro
      - ./pki/ca:/etc/grafana/pki:ro   # Lab 4: root_ca_cert = /etc/grafana/pki/acme-ca.crt
    environment:
      GF_SERVER_ROOT_URL: http://grafana.localhost:${GIA_PORT:-18080}
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_LDAP_ENABLED: "true"
      GF_AUTH_LDAP_CONFIG_FILE: /etc/grafana/ldap.toml
      GF_AUTH_LDAP_ALLOW_SIGN_UP: "true"
      # Sem isto, uma conta criada por um login pelo diretório recebe "user already exists"
      # ao entrar pelo Keycloak. Ligar significa casar contas pelo e-mail vindo do provedor,
      # e é inseguro justamente por isso: quem controla o e-mail assume a conta.
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: "true" 
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak ACME"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: grafana-secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://keycloak.localhost:${GIA_PORT:-18080}/realms/acme/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak.localhost:${GIA_PORT:-18080}/realms/acme/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak.localhost:${GIA_PORT:-18080}/realms/acme/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: "http://keycloak.localhost:${GIA_PORT:-18080}/realms/acme/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=http%3A%2F%2Fgrafana.localhost%3A${GIA_PORT:-18080}%2Flogin"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      # RBAC via claim "groups" (client scope criado no lab6-sso.sh): ti -> Admin, resto -> Viewer
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'ti') && 'Admin' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.localhost`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    depends_on:
      openldap: { condition: service_healthy }
    networks: [gia]

  # ================= Lab 6: SSO OIDC =================
  app:
    # aplicação "legada" sem autenticação própria; protegida pelo oauth2-proxy
    image: traefik/whoami:v1.10
    profiles: [lab6]
    networks: [gia]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    profiles: [lab6]
    # Ele faz OIDC discovery em .../realms/acme NO BOOT, e esse realm só nasce quando o aluno
    # roda o lab da federação. Em máquina limpa o container morre e derruba o 'up --wait',
    # logo na primeira coisa que a turma faz. Com restart automático ele volta sozinho depois.
    restart: unless-stopped
    command:
      - --provider=keycloak-oidc
      - --client-id=app-acme
      - --client-secret=app-secret
      - --oidc-issuer-url=http://keycloak.localhost:${GIA_PORT:-18080}/realms/acme
      - --redirect-url=http://app.localhost:${GIA_PORT:-18080}/oauth2/callback
      - --upstream=http://app:80
      - --http-address=0.0.0.0:4180
      # 32 bytes exatos depois do base64. O oauth2-proxy cifra o cookie com AES e só
      # aceita 16, 24 ou 32; o segredo anterior dava 28 e o container morria no start
      # com exit 1, o que derrubava app.localhost e fazia o Lab 6 falhar sem explicação.
      - --cookie-secret=YWNtZS1naWEtbGFib3JhdG9yaW8tY29va2llLTMyYnk=
      - --cookie-secure=false
      - --email-domain=*
      - --code-challenge-method=S256
      - --pass-user-headers=true
      - --set-xauthrequest=true
      - --skip-provider-button=true
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`app.localhost`)
      - traefik.http.services.app.loadbalancer.server.port=4180
    depends_on:
      keycloak: { condition: service_healthy }
    networks: [gia]

  # ================= Lab 7: IdP externo SAML ("parceiro") =================
  idp:
    # SimpleSAMLphp pré-configurado como IdP de testes. Usuários: user1/user1pass, user2/user2pass
    # Atenção: imagem antiga e só amd64 (ver README). Fallback: realm "parceiro" no próprio Keycloak.
    image: kristophjunge/test-saml-idp:1.15
    profiles: [lab7]
    volumes:
      # Os dois consertos que fazem o login SAML funcionar no navegador: assinatura em
      # RSA-SHA256 (o JDK do Keycloak 26 recusa SHA-1) e uid legível em vez de "1".
      - ./idp/saml20-idp-hosted.php:/var/www/simplesamlphp/metadata/saml20-idp-hosted.php:ro
      - ./idp/authsources.php:/var/www/simplesamlphp/config/authsources.php:ro
    environment:
      SIMPLESAMLPHP_SP_ENTITY_ID: http://keycloak.localhost:${GIA_PORT:-18080}/realms/acme
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: http://keycloak.localhost:${GIA_PORT:-18080}/realms/acme/broker/parceiro-saml/endpoint
      SIMPLESAMLPHP_SP_SINGLE_LOGOUT_SERVICE: http://keycloak.localhost:${GIA_PORT:-18080}/realms/acme/broker/parceiro-saml/endpoint
    labels:
      - traefik.enable=true
      - traefik.http.routers.idp.rule=Host(`idp.localhost`)
      - traefik.http.services.idp.loadbalancer.server.port=8080
    networks: [gia]

networks:
  gia:

volumes:
  ldap_data:
  ldap_config:
  kc_data:
  toolbox_out:
